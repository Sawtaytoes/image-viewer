name: CI

on:
  push:
  pull_request:

jobs:
  # The docs-only detector is SHARED: the body lives in Charcuterie and is
  # imported, not copied. Fix it there, then move the `workflows-v1` tag.
  #
  # WARNING: imported from GitHub. A reusable
  # workflow resolves on THIS host only. A cross-host import is dropped
  # SILENTLY -- the run still reports success -- so the gates below would
  # never run. Consumers must also keep turning their gates off with `if:`
  # rather than `paths-ignore:`, or a required check stays pending forever.
  changes:
    uses: Sawtaytoes/charcuterie/.github/workflows/shared-docs-only-changes.yml@workflows-v1

  # The one gate a docs-only change DOES run. It lints the decision records
  # the pull request TOUCHED, never the whole tree.
  # This repo keeps 71 decision records.
  docs:
    uses: Sawtaytoes/charcuterie/.github/workflows/shared-docs-lint.yml@workflows-v1


  ci:
    needs: [changes]
    # Gitea Actions also reads .github/workflows, but we only want CI on GitHub.
    # On Gitea, server_url is the Gitea instance URL, so this job is skipped there.
    # Also skipped when the diff is documentation only.
    if: ${{ needs.changes.outputs.isDocsOnly != 'true' && (github.server_url == 'https://github.com') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Test
        run: yarn test:run

      - name: Typecheck
        run: yarn typecheck

      - name: Lint (Biome)
        run: yarn lint:biome

      - name: Lint (ESLint)
        run: yarn lint:eslint

      # The only gate that can see a Tailwind class that generates nothing.
      # jsdom does not compute styles from a stylesheet, so a `className`
      # assertion in a test passes whether or not the utility exists — a class
      # built from a template literal renders unstyled with no error anywhere.
      # This runs the real Tailwind pass over the real source.
      - name: Build renderer
        run: yarn build:renderer

  # Visual regression — the SHARED workflow, imported by tag like the two
  # above. This app has no Storybook, so every shot comes from
  # `scripts/vrtCapture.mjs`: the real renderer's browser build over the fake
  # filesystem, seven scenes x Wide/Narrow View x light/dark. The capture
  # builds its own bundle, so there is no `buildCommand`. It runs on the LAN
  # runner, which the shared workflow keeps away from fork pull requests.
  # A red `vrt` is diagnosed in its own pull request, never re-run into green.
  # GitHub only, like `ci`: the shared workflow resolves on this host alone.
  vrt:
    needs: [changes]
    if: ${{ needs.changes.outputs.isDocsOnly != 'true' && (github.server_url == 'https://github.com') }}
    permissions: { contents: read, statuses: write, pull-requests: write }
    uses: Sawtaytoes/charcuterie/.github/workflows/shared-vrt.yml@workflows-v1
    with:
      # No Electron binary: the capture shoots the browser build only.
      setupCommand: ELECTRON_SKIP_BINARY_DOWNLOAD=1 yarn install --immutable
      captureCommand: node scripts/vrtCapture.mjs
    secrets: inherit
