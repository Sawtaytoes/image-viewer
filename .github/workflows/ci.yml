name: CI

on:
  push:
  pull_request:

jobs:
  # Decide whether this change is documentation only.
  #
  # Nothing below reads markdown. There is no markdownlint, no remark, no
  # prettier over `.md` and no link check anywhere in this fleet, and Biome
  # does not format markdown. So a `.md`-only diff makes every gate below run
  # without ever opening the file that changed.
  #
  # WARNING: this job must run on EVERY event, and the gates below must be
  # turned off with `if:` rather than with `paths-ignore:` on the trigger.
  # Branch protection requires the `ci` check. A job that `if:` skips still
  # reports its context: GitHub records the conclusion `skipped` and counts it
  # as success, and Forgejo posts `skipped` and keeps the combined state green
  # (verified on portly-controllers#17, which merged with `CI / check
  # (pull_request)` skipped). A workflow that never STARTED posts nothing at
  # all, so a required check stays pending and the pull request can never
  # merge, with no failure to explain why.
  changes:
    runs-on: ubuntu-latest

    outputs:
      isDocsOnly: ${{ steps.detect.outputs.isDocsOnly }}

    steps:
      - uses: actions/checkout@v7
        # The full history: the diff below needs the base commit present.
        with: { fetch-depth: 0 }

      - id: detect
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          # Fail SAFE. Anything we cannot diff -- a workflow_dispatch, a tag, a
          # new branch whose `before` is all zeros, a base commit the fetch
          # missed -- runs the whole suite rather than skipping it.
          if [ -z "${BASE_SHA:-}" ] \
            || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null
          then
            echo "No usable base commit -- running every gate."
            echo "isDocsOnly=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mergeBase="$(git merge-base "${BASE_SHA}" HEAD || echo "${BASE_SHA}")"
          changedFiles="$(git diff --name-only "${mergeBase}" HEAD)"
          printf 'Changed files:\n%s\n\n' "${changedFiles}"

          isDocsOnly=true

          if [ -z "${changedFiles}" ]
          then
            isDocsOnly=false
          elif printf '%s\n' "${changedFiles}" | grep -q '^\.changeset/'
          then
            # A changeset file is markdown, but it is a RELEASE input rather
            # than documentation. Treat it as code.
            isDocsOnly=false
          elif printf '%s\n' "${changedFiles}" | grep -qvE '^(.+\.md|LICENSE)$'
          then
            # `.mdx` deliberately does NOT match `.md$` -- it is Storybook
            # source in several repos here, and it compiles.
            isDocsOnly=false
          fi

          echo "isDocsOnly=${isDocsOnly}"
          echo "isDocsOnly=${isDocsOnly}" >> "$GITHUB_OUTPUT"

  ci:
    needs: [changes]
    # Gitea Actions also reads .github/workflows, but we only want CI on GitHub.
    # On Gitea, server_url is the Gitea instance URL, so this job is skipped there.
    # Also skipped when the diff is documentation only.
    if: ${{ needs.changes.outputs.isDocsOnly != 'true' && (github.server_url == 'https://github.com') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Test
        run: yarn test:run

      - name: Typecheck
        run: yarn typecheck

      - name: Lint (Biome)
        run: yarn lint:biome

      - name: Lint (ESLint)
        run: yarn lint:eslint

      # The only gate that can see a Tailwind class that generates nothing.
      # jsdom does not compute styles from a stylesheet, so a `className`
      # assertion in a test passes whether or not the utility exists — a class
      # built from a template literal renders unstyled with no error anywhere.
      # This runs the real Tailwind pass over the real source.
      - name: Build renderer
        run: yarn build:renderer
