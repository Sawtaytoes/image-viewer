<!doctype html>
<!-- The three Charcuterie axes, all on `<html>` and all static.

     `data-scheme="dark"` is pinned rather than following the OS: this is an
     image viewer, and bright chrome beside a photo is exactly what a viewer is
     not for. It used to be unreachable as a *choice* — the colours were
     hardcoded greys in twenty-four Emotion blocks — so pinning it here is the
     first time the app has a scheme it could change at all.

     `data-variant` is omitted deliberately: `daylight` is the default and
     `:root` carries it, so naming it here would be a second place to change if
     the fleet ever moves.

     `data-density="comfortable"` says the default out loud, and the value is
     the interesting part. This app is touch-first on a Surface
     (`docs/decisions/2026-06-03-touch-first-is-the-whole-point.md`), which
     argues for `kiosk` — but every control here still carries the explicit
     pixel size it had under Emotion, so switching density would resize all of
     them at once with no way to tell a deliberate change from a regression.
     `kiosk` is PHASE 2's, once the controls come from `@charcuterie/ui` and the
     density axis is the thing that sizes them. -->
<html
  lang="en"
  data-scheme="dark"
  data-density="comfortable"
>
  <head>
    <meta charset="UTF-8" />

    <meta
      content="max-age=604800"
      http-equiv="cache-control"
    />

    <meta
      content="width=device-width, initial-scale=1"
      name="viewport"
    />

    <!-- The Google Fonts `<link>` pair that used to be here is gone. Source
         Sans Pro is bundled out of `src/fonts/` by `src/styles/tailwind.css`,
         which is what `docs/decisions/2026-06-30-self-host-fonts-locally.md`
         asked for and what `startup-speed-is-top-priority` needs — a CDN
         round-trip on every window open is the cost that decision names, and
         this app opens several windows. -->

    <title>Image Viewer</title>

    <style>
      /* Prevent a white flash before the bundled CSS loads.

         The one hex left in the app chrome, and it has to be one: this rule
         exists precisely for the moment BEFORE any stylesheet has parsed, so it
         cannot read a custom property. It is `daylight`'s `surface.base` at
         `data-scheme="dark"`, and `firstPaintColour.test.ts` reads the token out
         of `@charcuterie/tokens` and fails if the two ever drift.

         `color-scheme` is set here for the same reason: the native scrollbar is
         painted before the token stylesheet lands. */
      html,
      body {
        background-color: #131822;
        color-scheme: dark;
      }
    </style>
  </head>
  <body class="bg-surface-base text-content-primary">
    <div id="reactRoot"></div>
    <script type="module" src="/src/renderer.tsx"></script>
  </body>
</html>
